<!doctype html>
<html lang="bn">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ইন্টারনেট সংযোগ নেই — আল আহসান ফাউন্ডেশন বাংলাদেশ</title>
    <meta name="theme-color" content="#004D40" />
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        font-family: "Hind Siliguri", "Noto Sans Bengali", system-ui, -apple-system, "Segoe UI", sans-serif;
        background: #f9f7f1;
        color: #111;
      }
      .card {
        width: 100%;
        max-width: 420px;
        background: #fff;
        border: 1px solid #e6e2d8;
        border-radius: 24px;
        padding: 32px 26px;
        text-align: center;
        box-shadow: 0 24px 50px -34px rgba(0, 0, 0, 0.4);
      }
      .mark {
        width: 58px; height: 58px; margin: 0 auto 18px;
        border-radius: 16px;
        background: #004d40;
        color: #d4af37;
        display: flex; align-items: center; justify-content: center;
        font-size: 26px; font-weight: 700;
      }
      h1 { font-size: 20px; margin: 0 0 8px; color: #004d40; }
      p { font-size: 14px; line-height: 1.7; color: #555; margin: 0 0 18px; }
      button {
        width: 100%;
        border: 0;
        border-radius: 14px;
        padding: 14px 18px;
        font-size: 15px;
        font-weight: 600;
        color: #fff;
        background: #004d40;
        cursor: pointer;
      }
      .hint { margin-top: 16px; font-size: 12px; color: #8a8a8a; }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="mark">আ</div>
      <h1>ইন্টারনেট সংযোগ নেই</h1>
      <p>
        আপনি এখন অফলাইনে আছেন। সংযোগ ফিরে এলে আবার চেষ্টা করুন — আপনার অনুদান ও রসিদের তথ্য নিরাপদে সংরক্ষিত আছে।
      </p>
      <button type="button" onclick="window.location.reload()">আবার চেষ্টা করুন</button>
      <p class="hint">আল আহসান ফাউন্ডেশন বাংলাদেশ</p>
    </main>
  </body>
</html>
